name: ResaleProfit
options:
  bundleIdPrefix: com.resaleprofit
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ResaleProfit:
    type: application
    platform: iOS
    sources:
      - path: Sources/ResaleProfit
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "ResaleProfit needs camera access so you can photograph an item to identify it and estimate resale profit."
        NSPhotoLibraryUsageDescription: "ResaleProfit needs photo library access so you can pick an existing photo of an item."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.resaleprofit.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
